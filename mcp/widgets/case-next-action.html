<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Case Next Action</title>
  <style>
    html, body { margin: 0; background: transparent; }
    body {
      color: var(--color-text-primary, #1c1917);
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      padding: 8px;
    }
    .card {
      background: var(--color-bg-primary, #fffdf8);
      border: 1px solid var(--color-border-default, #e7e5e4);
      border-radius: 16px;
      padding: 18px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .badges { display: flex; gap: 6px; }
    .badge {
      font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 999px;
      background: #efece4; color: #44403c;
    }
    .badge.warn { background: #fde68a; color: #78350f; }
    .subject { font-size: 1.15rem; font-weight: 700; margin: 10px 0 4px; }
    .caption { font-size: 13px; color: var(--color-text-secondary, #78716c); }
    hr { border: 0; border-top: 1px solid var(--color-border-default, #e7e5e4); margin: 12px 0; }
    .callout {
      border-left: 4px solid #b45309; background: #fff8e8;
      padding: 10px 12px; border-radius: 0 10px 10px 0; margin: 10px 0 12px;
    }
    .callout strong { display: block; margin-bottom: 2px; }
    .actions { display: flex; gap: 8px; margin: 12px 0 8px; }
    button {
      border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 650; cursor: pointer;
    }
    .primary { background: #1A1A2E; color: #fff; }
    .secondary { background: #e7e5e4; color: #1c1917; }
    h3 { margin: 10px 0 6px; font-size: 14px; }
    p { margin: 6px 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    /*__EXT_APPS_BUNDLE__*/
    (async () => {
      const SAMPLE = {
        caseNumber: "00001234",
        subject: "Payment failed on renewal invoice",
        priority: "High",
        slaHoursLeft: 2.5,
        slaAtRisk: true,
        customerName: "Northwind Traders",
        recommendedAction: "Confirm the card on file, then send the retry link and stay on the case until the payment posts.",
        ownerName: "Alex Rivera"
      };

      function render(data) {
        const sla = data.slaAtRisk
          ? `<div class="callout"><strong>SLA at risk</strong><p>${data.slaHoursLeft} hours remaining</p></div>`
          : "";
        document.getElementById("root").innerHTML = `
          <div class="card">
            <div class="row">
              <div class="caption">${data.caseNumber || ""}</div>
              <div class="badges">
                <span class="badge">${data.priority || ""}</span>
                ${data.slaAtRisk ? '<span class="badge warn">SLA</span>' : ""}
              </div>
            </div>
            <div class="subject">${data.subject || ""}</div>
            <div class="caption">${data.customerName || ""}</div>
            <hr>
            ${sla}
            <h3>Recommended next action</h3>
            <p>${data.recommendedAction || ""}</p>
            <div class="actions">
              <button class="primary" id="act" type="button">Take next action</button>
              <button class="secondary" id="view" type="button">View case</button>
            </div>
            <div class="caption">${data.ownerName || ""}</div>
          </div>`;
      }

      function parseToolResult(result) {
        const text = result?.content?.[0]?.text;
        if (!text) return SAMPLE;
        try { return JSON.parse(text); } catch { return SAMPLE; }
      }

      const { App } = globalThis.ExtApps;
      const app = new App({ name: "CaseNextAction", version: "1.0.0" }, {}, { autoResize: true });
      app.ontoolresult = (result) => render(parseToolResult(result));
      await app.connect();
      render(SAMPLE);
    })();
  </script>
</body>
</html>
